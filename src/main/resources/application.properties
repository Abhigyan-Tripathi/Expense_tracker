spring.application.name=ExpenseTracker
# --- Database connection ---
# In-memory H2 database named "expensedb". Data resets every restart -
# fine for learning/dev, would swap for Postgres in production.
spring.datasource.url=jdbc:h2:mem:expensedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate behavior ---
# "update" = Hibernate auto-creates/updates tables from our @Entity classes.
# Never use "update" in real production (use Flyway/Liquibase migrations
# instead) but it's exactly what we want while learning.
spring.jpa.hibernate.ddl-auto=update
# Prints the actual generated SQL to the console - useful for seeing what
# JPA/Hibernate is doing under the hood instead of treating it as a black box.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- H2 web console ---
# Browser-based GUI to inspect tables/rows at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Server port (8080 is already the default, listed for clarity) ---
server.port=8080
