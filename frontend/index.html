<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expense Tracker</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262a33;
    --text: #e6e8eb;
    --muted: #8b92a1;
    --accent: #5b8cff;
    --danger: #ff5b6b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 32px 16px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 24px; font-size: 14px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  form input, form select, form textarea {
    background: #0f1115;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 10px;
    border-radius: 6px;
    font-size: 14px;
  }
  form textarea { grid-column: span 2; resize: vertical; min-height: 40px; }
  form button {
    grid-column: span 2;
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  form button:hover { opacity: 0.9; }
  #status { font-size: 13px; margin-top: 8px; grid-column: span 2; color: var(--muted); }
  .summary-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; }
  .summary-row.total { font-weight: 600; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .del-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Expense Tracker</h1>
  <p class="sub">Talks to the Spring Boot API at localhost:8080</p>

  <div class="panel">
    <h2>Add a category</h2>
    <form id="categoryForm" style="grid-template-columns: 1fr auto;">
      <input type="text" id="categoryName" placeholder="e.g. Food, Travel, Rent" required>
      <button type="submit">Add</button>
    </form>
  </div>

  <div class="panel">
    <h2>Add an expense</h2>
    <form id="expenseForm">
      <input type="text" id="title" placeholder="Title" required>
      <input type="number" id="amount" placeholder="Amount" step="0.01" min="0" required>
      <input type="date" id="date" required>
      <select id="categoryId" required>
        <option value="">Select category...</option>
      </select>
      <textarea id="description" placeholder="Description (optional)"></textarea>
      <button type="submit">Add Expense</button>
      <div id="status"></div>
    </form>
  </div>

  <div class="panel">
    <h2>This month's summary</h2>
    <div id="summary">Loading...</div>
  </div>

  <div class="panel">
    <h2>All expenses</h2>
    <table>
      <thead>
        <tr><th>Title</th><th>Category</th><th>Amount</th><th>Date</th><th></th></tr>
      </thead>
      <tbody id="expenseRows"></tbody>
    </table>
  </div>
</div>

<script>
const API = "http://localhost:8080/api";

async function loadCategories() {
  const res = await fetch(`${API}/categories`);
  const categories = await res.json();
  const select = document.getElementById("categoryId");
  select.innerHTML = '<option value="">Select category...</option>' +
    categories.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
  return categories;
}

async function loadExpenses() {
  const res = await fetch(`${API}/expenses`);
  const expenses = await res.json();
  const rows = document.getElementById("expenseRows");
  rows.innerHTML = expenses.map(e => `
    <tr>
      <td>${e.title}</td>
      <td>${e.categoryName}</td>
      <td>₹${e.amount.toFixed(2)}</td>
      <td>${e.date}</td>
      <td><button class="del-btn" onclick="deleteExpense(${e.id})">Delete</button></td>
    </tr>
  `).join("");
}

async function loadSummary() {
  const res = await fetch(`${API}/expenses/summary`);
  const summary = await res.json();
  const el = document.getElementById("summary");
  const rows = Object.entries(summary.categoryBreakdown || {})
    .map(([name, amt]) => `<div class="summary-row"><span>${name}</span><span>₹${amt.toFixed(2)}</span></div>`)
    .join("");
  el.innerHTML = rows + `<div class="summary-row total"><span>Total</span><span>₹${(summary.totalAmount || 0).toFixed(2)}</span></div>`;
}

async function deleteExpense(id) {
  await fetch(`${API}/expenses/${id}`, { method: "DELETE" });
  loadExpenses();
  loadSummary();
}

document.getElementById("categoryForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("categoryName").value;
  await fetch(`${API}/categories`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name })
  });
  document.getElementById("categoryName").value = "";
  loadCategories();
});

document.getElementById("expenseForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const status = document.getElementById("status");
  const body = {
    title: document.getElementById("title").value,
    amount: parseFloat(document.getElementById("amount").value),
    date: document.getElementById("date").value,
    categoryId: parseInt(document.getElementById("categoryId").value),
    description: document.getElementById("description").value
  };
  const res = await fetch(`${API}/expenses`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (res.ok) {
    status.textContent = "";
    status.style.color = "var(--muted)";
    e.target.reset();
    loadExpenses();
    loadSummary();
  } else {
    const err = await res.json();
    status.textContent = err.message || "Something went wrong";
    status.style.color = "var(--danger)";
  }
});

loadCategories();
loadExpenses();
loadSummary();
</script>
</body>
</html>
